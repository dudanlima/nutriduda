<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#230E0F">
<title>Acompanhamento Nutricional</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Times New Roman",Times,serif;color:#EDDA9F;background:#230E0F url(ceu.jpg) center/cover fixed no-repeat;min-height:100vh;display:flex;flex-direction:column;position:relative}
body::before{content:"";position:fixed;inset:0;background:rgba(84,22,37,.82);z-index:0}
header,main{position:relative;z-index:1}
header{display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:10px;padding:14px 20px;background:rgba(35,14,15,.9)}
.painel-link{padding:10px 18px;border:1px solid #EDDA9F;border-radius:8px;color:#EDDA9F;text-decoration:none;font-size:16px}
.painel-link:hover{background:#EDDA9F;color:#230E0F}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;text-align:center}
.logo{width:min(440px,84vw);height:auto;display:block;margin:0 auto 44px}
.entrar{display:inline-block;padding:14px 56px;background:#EDDA9F;color:#230E0F;border-radius:8px;text-decoration:none;font-size:18px;font-weight:bold}
.entrar:hover{filter:brightness(1.05)}
@media(max-width:480px){.painel-link{width:100%;text-align:center}.entrar{padding:14px 40px}}
</style>
</head>
<body>
<header>
<a class="painel-link" href="painel/index.html">Painel do nutricionista</a>
</header>
<main>
<img class="logo" src="2.svg" alt="Acompanhamento Nutricional">
<a class="entrar" href="painel/index.html">Entrar</a>
</main>
</body>
</html>
