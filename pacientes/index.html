<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pacientes</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Times New Roman",Times,serif;color:#3B332C;background:#7A816C url("../ceu.jpg") center/cover no-repeat fixed;min-height:100vh}
body::before{content:"";position:fixed;inset:0;background:rgba(122,129,108,.55);z-index:0}
.app{position:relative;z-index:1;display:flex;min-height:100vh}
aside{width:230px;flex-shrink:0;background:rgba(122,129,108,.92);color:#E5DFD6;padding:22px 16px;transition:width .25s,padding .25s;overflow:hidden}
aside.recolhido{width:72px;padding:22px 10px}
.topo-menu{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:8px}
.alternar{width:38px;height:38px;border:1px solid #D1A9A5;border-radius:8px;background:transparent;color:#E5DFD6;font-size:20px;flex-shrink:0;cursor:pointer}
.alternar:hover{background:#D1A9A5;color:#7A816C}
.titulo-menu{font-size:17px;white-space:nowrap}
aside.recolhido .titulo-menu,aside.recolhido .rotulo{display:none}
.menu{display:flex;flex-direction:column;gap:8px}
.menu a{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid transparent;border-radius:8px;color:#E5DFD6;font-size:17px;white-space:nowrap;text-decoration:none}
.menu a:hover{background:rgba(229,223,214,.18)}
.menu a.ativo{background:#E5DFD6;color:#7A816C;border-color:#E5DFD6}
.icone{width:22px;text-align:center;flex-shrink:0;font-weight:bold;color:#D1A9A5}
.menu a.ativo .icone{color:#AE6965}
main{flex:1;min-width:0;padding:clamp(18px,3vw,36px)}
header.cabecalho{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:10px;margin-bottom:24px}
.botao-topo{padding:10px 18px;border:1px solid #D1A9A5;border-radius:8px;color:#E5DFD6;text-decoration:none;font-size:16px;background:rgba(122,129,108,.35)}
.botao-topo:hover{background:#D1A9A5;color:#7A816C}
.cartao{background:rgba(229,223,214,.94);border:1px solid #D1A9A5;border-radius:14px;padding:clamp(22px,4vw,40px);box-shadow:0 8px 24px rgba(59,51,44,.18);margin-bottom:20px}
.cartao h1{margin:0 0 10px;font-weight:normal;font-size:clamp(26px,4vw,38px);color:#7A816C}
.cartao p{margin:0 0 14px;font-size:18px;line-height:1.5}
.destaque{color:#AE6965;font-style:italic}
.acoes{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px;align-items:center}
.btn{padding:12px 20px;border:1px solid #7A816C;border-radius:10px;background:#7A816C;color:#FFFFFF;font:inherit;font-size:17px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:#AE6965;border-color:#AE6965}
.btn.secundario{background:transparent;color:#7A816C}
.btn.secundario:hover{background:#D1A9A5;color:#7A816C;border-color:#D1A9A5}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;margin-top:10px}
.perfil{background:#FFFFFF;border:1px solid #D1A9A5;border-radius:14px;padding:18px 12px;text-align:center;cursor:pointer;color:#3B332C;font:inherit;display:block;width:100%;text-decoration:none}
.perfil:hover{border-color:#7A816C;box-shadow:0 4px 14px rgba(59,51,44,.15)}
.foto{width:84px;height:84px;border-radius:50%;margin:0 auto 12px;background:#E5DFD6 center/cover no-repeat;border:2px solid #D1A9A5;display:flex;align-items:center;justify-content:center;color:#7A816C;font-size:28px}
.perfil .nome{display:block;font-weight:bold;font-size:17px;margin-bottom:4px}
.perfil .objetivo{display:block;font-style:italic;font-size:15px;color:#AE6965;margin-bottom:4px}
.perfil .idade{display:block;font-size:14px;color:#A58B71}
.vazio{font-style:italic;color:#A58B71;margin-top:14px}
.oculto{display:none!important}
@media(max-width:700px){
  .app{flex-direction:column}
  aside{width:100%;padding:14px 16px}
  aside.recolhido{width:100%;padding:14px 16px}
  aside.recolhido .titulo-menu,aside.recolhido .rotulo{display:inline}
  .menu{flex-direction:row;flex-wrap:wrap}
  .menu a{flex:1 1 auto;justify-content:center}
  .rotulo{display:inline}
  aside.fechado .menu{display:none}
  .botao-topo{width:100%;text-align:center}
  .lista{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}
}
</style>
</head>
<body>
<div class="app">
<aside id="menu">
<div class="topo-menu">
<span class="titulo-menu">Menu</span>
<button class="alternar" id="alternar" aria-label="Recolher ou expandir menu">&#9776;</button>
</div>
<nav class="menu">
<a href="../index.html"><span class="icone">I</span><span class="rotulo">Início</span></a>
<a href="../index.html#agenda"><span class="icone">A</span><span class="rotulo">Agenda</span></a>
<a href="../plano/index.html"><span class="icone">N</span><span class="rotulo">Plano alimentar</span></a>
<a href="index.html" class="ativo"><span class="icone">P</span><span class="rotulo">Pacientes</span></a>
<a href="cadastro.html"><span class="icone">+</span><span class="rotulo">Cadastrar paciente</span></a>
<a href="../index.html#configuracoes"><span class="icone">C</span><span class="rotulo">Configurações</span></a>
</nav>
</aside>
<main>
<header class="cabecalho">
<a class="botao-topo" href="../../login/index.html">Sair</a>
</header>
<div class="cartao">
<h1>Pacientes</h1>
<p>Clique em um perfil para ver as informações completas.</p>
<div class="acoes"><a class="btn" href="cadastro.html">Cadastrar paciente</a></div>
<div class="lista" id="lista"></div>
<p class="vazio" id="sem-pacientes">Nenhum paciente cadastrado ainda. Use "Cadastrar paciente" para começar.</p>
</div>
</main>
</div>
<script>
(function(){
  var menu=document.getElementById('menu');
  document.getElementById('alternar').addEventListener('click',function(){
    menu.classList.toggle('recolhido');
    menu.classList.toggle('fechado');
  });
  var pacientes=[];
  try{pacientes=JSON.parse(localStorage.getItem('pacientes')||'[]');}catch(e){pacientes=[];}
  function esc(t){var d=document.createElement('div');d.textContent=t==null?'':String(t);return d.innerHTML;}
  var lista=document.getElementById('lista');
  document.getElementById('sem-pacientes').classList.toggle('oculto',pacientes.length>0);
  pacientes.forEach(function(p,i){
    var a=document.createElement('a');
    a.className='perfil';
    a.href='perfil/index.html?i='+i;
    a.innerHTML='<div class="foto"'+(p.foto?' style="background-image:url('+esc(p.foto)+')"':'')+'>'+(p.foto?'':esc((p.nome||'?').charAt(0).toUpperCase()))+'</div><span class="nome">'+esc(p.nome)+'</span><span class="objetivo">'+esc(p.objetivo)+'</span><span class="idade">'+esc(p.idade)+' anos</span>';
    lista.appendChild(a);
  });
})();
</script>
</body>
</html>
