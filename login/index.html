<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7A816C">
<title>Login</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Times New Roman",Times,serif;color:#E5DFD6;background:#7A816C url("../ceu.jpg") center/cover no-repeat fixed;min-height:100vh}
body::before{content:"";position:fixed;inset:0;background:rgba(122,129,108,.55);z-index:0}
header,.centro{position:relative;z-index:1}
header{display:flex;justify-content:flex-end;padding:14px 20px}
.painel-link{padding:10px 18px;border:1px solid #D1A9A5;border-radius:8px;color:#E5DFD6;text-decoration:none;font-size:16px;background:rgba(122,129,108,.35)}
.painel-link:hover{background:#D1A9A5;color:#7A816C}
.centro{min-height:calc(100vh - 60px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.logo{width:min(440px,84vw);height:auto;display:block;margin:0 auto 24px}
.btn{display:inline-block;min-width:220px;padding:14px 28px;border-radius:10px;border:1px solid #D1A9A5;background:rgba(229,223,214,.92);color:#7A816C;font:inherit;font-size:18px;font-weight:bold;text-decoration:none;cursor:pointer}
.btn:hover{background:#D1A9A5;color:#7A816C}
@media(max-width:480px){.painel-link{width:100%;text-align:center}}
</style>
</head>
<body>
<header>
<a class="painel-link" href="../painel/index.html">Painel do nutricionista</a>
</header>
<div class="centro">
<img class="logo" src="../2.svg" alt="Logotipo">
<a class="btn" href="../painel/index.html">Entrar</a>
</div>
</body>
</html>
