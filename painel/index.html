<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7A816C">
<title>Painel da nutricionista</title>
<style>
:root{--sage:#7A816C;--rose:#D1A9A5;--rust:#AE6965;--oak:#A58B71;--bone:#E5DFD6;--ink:#3B332C;--branco:#FFFFFF;--linha:rgba(59,51,44,.18)}
*{box-sizing:border-box}
body{margin:0;font-family:"Times New Roman",Times,serif;color:var(--ink);background:var(--bone);min-height:100vh}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{--sb:230px;display:grid;grid-template-columns:var(--sb) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .25s ease}
.app.recolhido{--sb:76px}
aside{background:var(--sage);padding:28px 16px;position:sticky;top:0;height:100vh;overflow:hidden;color:var(--bone)}
.app.recolhido aside{padding:28px 10px}
.topo-menu{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:18px;min-height:40px}
.app.recolhido .topo-menu{justify-content:center}
.marca{font-size:17px;white-space:nowrap;overflow:hidden}
.app.recolhido .marca{display:none}
.alternar{background:transparent;border:1px solid var(--rose);color:var(--bone);border-radius:8px;width:40px;height:40px;min-width:40px;display:flex;align-items:center;justify-content:center;padding:0}
.alternar:hover{background:var(--rose);color:var(--sage)}
.alternar svg{width:20px;height:20px;stroke:currentColor;stroke-width:2;fill:none}
.menu button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin-bottom:8px;padding:11px 14px;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--bone);font-size:16px;white-space:nowrap}
.menu button:hover{background:rgba(229,223,214,.18)}
.menu button.ativo{background:var(--bone);color:var(--ink);border-color:var(--bone)}
.menu .ini{display:none;width:36px;height:36px;min-width:36px;border:1px solid currentColor;border-radius:50%;align-items:center;justify-content:center;font-size:13px}
.app.recolhido .menu .ini{display:flex}
.app.recolhido .menu .rot{display:none}
.app.recolhido .menu button{justify-content:center;padding:11px 0}
main{padding:clamp(18px,3vw,36px);min-width:0}
.view{display:none}
header.topo{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:26px}
h1{margin:0;font-weight:normal;font-size:clamp(26px,4vw,34px);color:var(--rust)}
h3{margin:0 0 6px;font-weight:normal;font-size:20px;color:var(--rust)}
.btn{padding:10px 18px;border-radius:8px;border:1px solid var(--rust);background:var(--rust);color:var(--bone)}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:transparent;color:var(--rust);border-color:var(--oak)}
.btn.peq{padding:6px 12px;font-size:14px}
.btn.perigo{background:transparent;color:var(--rust);border-color:var(--rust)}
.painel{background:var(--branco);border:1px solid var(--linha);border-radius:14px;padding:clamp(16px,3vw,24px)}
.mes{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.mes strong{font-weight:normal;color:var(--rust);font-size:20px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dia-sem{text-align:center;color:var(--sage);font-size:14px;padding:4px;font-weight:bold}
.dia{min-height:78px;padding:6px;border:1px solid var(--linha);border-radius:8px;background:#FAF7F2;color:var(--ink);text-align:left;overflow:hidden}
.dia.fora{opacity:.42}
.dia.sel{border:2px solid var(--rust);background:var(--rose)}
.dia .n{display:block;margin-bottom:4px;font-weight:bold;color:var(--ink)}
.dia .ev{display:block;font-size:12px;background:var(--rust);color:var(--bone);border-radius:4px;padding:2px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lista-dia{margin-top:18px}
.item{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--linha)}
.item:last-child{border-bottom:0}
.hora{color:var(--rust);white-space:nowrap;font-weight:bold}
.vazio{color:var(--sage);padding:14px 0}
.pacientes{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
.perfil-card{padding:22px 14px;text-align:center;border:1px solid var(--linha);border-radius:16px;background:var(--branco);cursor:pointer}
.perfil-card:hover,.perfil-card:focus{border-color:var(--rust);outline:none;box-shadow:0 0 0 2px var(--rose)}
.perfil-card p{margin:4px 0;font-size:15px}
.foto{width:96px;height:96px;border-radius:50%;margin:0 auto 12px;border:2px solid var(--sage);overflow:hidden;background:var(--rose);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:bold}
.foto img{width:100%;height:100%;object-fit:cover}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.campo label{display:block;color:var(--sage);margin-bottom:5px}
.campo input,.campo textarea{width:100%;padding:10px;border:1px solid var(--linha);border-radius:7px;background:var(--branco);color:var(--ink)}
.campo input:focus,.campo textarea:focus{outline:none;border-color:var(--rust)}
.campo textarea{min-height:90px;resize:vertical}
.campo.largo{grid-column:1/-1}
.acoes{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.detalhes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.det{border:1px solid var(--linha);border-radius:9px;padding:12px;background:#FAF7F2}
.det strong{display:block;color:var(--sage);font-weight:bold;margin-bottom:4px}
.aviso{margin:0 0 18px;padding:12px 14px;border-left:4px solid var(--rust);background:var(--rose);border-radius:5px;font-size:15px;line-height:1.45;color:var(--ink)}
@media(max-width:760px){
.app,.app.recolhido{grid-template-columns:1fr}
aside,.app.recolhido aside{position:static;height:auto;overflow:visible;padding:12px 14px}
.topo-menu,.app.recolhido .topo-menu{margin-bottom:0;justify-content:space-between}
.app.recolhido .marca{display:block}
.menu{display:none;flex-direction:column;margin-top:12px}
.app:not(.recolhido) .menu{display:flex}
.menu button,.app.recolhido .menu button{width:100%;margin:0 0 8px;justify-content:flex-start;padding:11px 14px}
.menu .ini{display:none}
.menu .rot{display:inline}
.app.recolhido .menu .rot{display:inline}
.form{grid-template-columns:1fr}
.dia{min-height:56px;padding:3px}
.dia .ev{font-size:10px}
}
</style>
</head>
<body>
<div class="app" id="app">
<aside>
<div class="topo-menu">
<span class="marca">Menu</span>
<button class="alternar" id="alternar" aria-label="Recolher menu" aria-expanded="true">
<svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
</button>
</div>
<nav class="menu">
<button data-v="agenda" class="ativo"><span class="ini">AG</span><span class="rot">Agenda</span></button>
<button data-v="pacientes"><span class="ini">PA</span><span class="rot">Pacientes</span></button>
<button data-v="modelos"><span class="ini">MO</span><span class="rot">Modelos de plano</span></button>
<button data-v="substituicoes"><span class="ini">SU</span><span class="rot">Substituições</span></button>
<button data-v="cadastro"><span class="ini">CA</span><span class="rot">Cadastrar paciente</span></button>
</nav>
</aside>
<main>
<section class="view" id="v-agenda">
<header class="topo"><h1>Agenda</h1><button class="btn" data-v="cadastro">Cadastrar paciente</button></header>
<div class="painel">
<div class="mes"><button class="btn sec peq" id="ant">‹ Anterior</button><strong id="mes-titulo"></strong><button class="btn sec peq" id="prox">Próximo ›</button></div>
<div class="cal" id="cal"></div>
</div>
<div class="painel lista-dia"><h3 id="dia-titulo"></h3><div id="dia-lista"></div></div>
</section>

<section class="view" id="v-pacientes">
<header class="topo"><h1>Pacientes</h1><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec" id="limpar">Limpar exemplos</button><button class="btn" data-v="cadastro">Cadastrar paciente</button></div></header>
<div class="pacientes" id="lista-pac"></div>
</section>

<section class="view" id="v-perfil"><div id="perfil"></div></section>

<section class="view" id="v-cadastro">
<header class="topo"><h1>Cadastrar paciente</h1></header>
<form id="form" class="form">
<div class="campo"><label for="nome">Nome</label><input id="nome" name="nome" required maxlength="120"></div>
<div class="campo"><label for="idade">Idade</label><input id="idade" name="idade" type="number" min="0" max="120"></div>
<div class="campo"><label for="objetivo">Objetivo</label><input id="objetivo" name="objetivo" maxlength="160"></div>
<div class="campo"><label for="telefone">Telefone (opcional)</label><input id="telefone" name="telefone" type="tel" maxlength="40"></div>
<div class="campo"><label for="email">E-mail (opcional)</label><input id="email" name="email" type="email" maxlength="160"></div>
<div class="campo"><label for="foto">Foto do perfil (opcional)</label><input id="foto" name="foto" type="file" accept="image/*"></div>
<div class="campo"><label for="data">Data do atendimento (opcional)</label><input id="data" name="data" type="date"></div>
<div class="campo"><label for="hora">Horário (opcional)</label><input id="hora" name="hora" type="time"></div>
<div class="campo largo"><label for="obsag">Observação do agendamento (opcional)</label><input id="obsag" name="obsag" maxlength="160"></div>
<div class="campo largo"><label for="obs">Observações do perfil (opcional)</label><textarea id="obs" name="obs" maxlength="2000"></textarea></div>
<div class="acoes"><button class="btn" type="submit">Salvar paciente</button><button class="btn sec" type="button" data-v="pacientes">Cancelar</button></div>
</form>
</section>

<section class="view" id="v-modelos">
<header class="topo"><h1>Modelos de plano</h1></header>
<div class="aviso">Esta parte entra na próxima etapa.</div>
</section>

<section class="view" id="v-substituicoes">
<header class="topo"><h1>Substituições</h1></header>
<div class="aviso">Esta parte entra na próxima etapa.</div>
</section>
</main>
</div>

<script>
const app=document.getElementById("app");
const alt=document.getElementById("alternar");
const mq=matchMedia("(max-width:760px)");
function aplicar(r){
app.classList.toggle("recolhido",r);
alt.setAttribute("aria-expanded",String(!r));
alt.setAttribute("aria-label",r?"Expandir menu":"Recolher menu");
}
let salvo=null;
try{salvo=localStorage.getItem("menuRecolhido")}catch(e){}
aplicar(salvo!==null?salvo==="1":mq.matches);
alt.onclick=()=>{
const r=!app.classList.contains("recolhido");
aplicar(r);
try{localStorage.setItem("menuRecolhido",r?"1":"0")}catch(e){}
};
document.querySelectorAll(".menu button").forEach(b=>b.addEventListener("click",()=>{if(mq.matches)aplicar(true)}));

const KEY="painelNutricionista";
const hoje=new Date();
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iniciais=n=>String(n||"?").trim().split(/\s+/).slice(0,2).map(s=>s[0]).join("").toUpperCase();
function seed(){
const nomes=[["Marina Costa",28,"Comer melhor e ter mais disposição"],["Lucas Almeida",34,"Emagrecimento"],["Beatriz Santos",25,"Hipertrofia"],["Rafael Oliveira",41,"Manutenção de peso"]];
const horas=["09:00","10:30","13:00","15:00"],dias=[3,8,14,21];
const patients=nomes.map((n,i)=>({id:"ex"+i,nome:n[0],idade:n[1],objetivo:n[2],telefone:"",email:"",obs:"Perfil de exemplo",foto:"",ex:true}));
const appointments=patients.map((p,i)=>({id:"exa"+i,pid:p.id,data:ymd(new Date(hoje.getFullYear(),hoje.getMonth(),dias[i])),hora:horas[i],obs:"Agendamento de exemplo",ex:true}));
return {patients,appointments};
}
let S=null;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!Array.isArray(S.patients)||!Array.isArray(S.appointments))S=seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("Não foi possível salvar neste navegador.")}}
const pname=id=>(S.patients.find(p=>p.id===id)||{nome:"Paciente removido"}).nome;
let cur=new Date(hoje.getFullYear(),hoje.getMonth(),1), sel=ymd(hoje);

function ir(v){
document.querySelectorAll(".view").forEach(s=>s.style.display=s.id==="v-"+v?"block":"none");
document.querySelectorAll(".menu button").forEach(b=>b.classList.toggle("ativo",b.dataset.v===v));
if(v==="agenda")renderAgenda();
if(v==="pacientes")renderPacientes();
window.scrollTo(0,0);
}
document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>ir(b.dataset.v));

function renderAgenda(){
const y=cur.getFullYear(),m=cur.getMonth();
document.getElementById("mes-titulo").textContent=cur.toLocaleDateString("pt-BR",{month:"long",year:"numeric"});
const nomes=["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
let h=nomes.map(n=>`<div class="dia-sem">${n}</div>`).join("");
const ini=new Date(y,m,1-((new Date(y,m,1).getDay()+6)%7));
for(let i=0;i<42;i++){
const d=new Date(ini.getFullYear(),ini.getMonth(),ini.getDate()+i),k=ymd(d);
const ev=S.appointments.filter(a=>a.data===k);
h+=`<button class="dia${d.getMonth()!==m?" fora":""}${k===sel?" sel":""}" data-d="${k}"><span class="n">${d.getDate()}</span>${ev.slice(0,2).map(a=>`<span class="ev">${esc(a.hora)} ${esc(pname(a.pid))}</span>`).join("")}${ev.length>2?`<span class="ev">+${ev.length-2}</span>`:""}</button>`;
}
const cal=document.getElementById("cal");
cal.innerHTML=h;
cal.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{sel=b.dataset.d;renderAgenda()});
const [ya,ma,da]=sel.split("-").map(Number);
document.getElementById("dia-titulo").textContent=new Date(ya,ma-1,da).toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});
const lista=S.appointments.filter(x=>x.data===sel).sort((p,q)=>p.hora.localeCompare(q.hora));
document.getElementById("dia-lista").innerHTML=lista.length?lista.map(x=>`<div class="item"><span><strong>${esc(pname(x.pid))}</strong>${x.obs?`<br><span style="color:var(--sage)">${esc(x.obs)}</span>`:""}</span><span class="hora">${esc(x.hora)}</span></div>`).join(""):'<div class="vazio">Nenhum atendimento neste dia.</div>';
}
document.getElementById("ant").onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()-1,1);renderAgenda()};
document.getElementById("prox").onclick=()=>{cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);renderAgenda()};

function renderPacientes(){
const el=document.getElementById("lista-pac");
if(!S.patients.length){el.innerHTML='<div class="vazio">Nenhum paciente cadastrado.</div>';return}
el.innerHTML=S.patients.map(p=>`<div class="perfil-card" tabindex="0" data-p="${esc(p.id)}"><div class="foto">${p.foto?`<img src="${esc(p.foto)}" alt="">`:esc(iniciais(p.nome))}</div><h3>${esc(p.nome)}</h3><p>${esc(p.objetivo||"Objetivo não informado")}</p><p>${p.idade!==""&&p.idade!=null?esc(p.idade)+" anos":"Idade não informada"}</p></div>`).join("");
el.querySelectorAll("[data-p]").forEach(c=>{
const abre=()=>abrirPerfil(c.dataset.p);
c.onclick=abre;
c.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();abre()}};
});
}
document.getElementById("limpar").onclick=()=>{
if(!confirm("Remover os exemplos?"))return;
S.patients=S.patients.filter(p=>!p.ex);
const ids=S.patients.map(p=>p.id);
S.appointments=S.appointments.filter(a=>!a.ex&&ids.includes(a.pid));
save();renderPacientes();
};

function abrirPerfil(id){
const p=S.patients.find(x=>x.id===id);if(!p)return;
const ap=S.appointments.filter(x=>x.pid===id).sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));
const fmt=d=>{const [y,m,dd]=d.split("-");return dd+"/"+m+"/"+y};
document.getElementById("perfil").innerHTML=`<header class="topo"><div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><div class="foto" style="width:120px;height:120px;margin:0;font-size:40px">${p.foto?`<img src="${esc(p.foto)}" alt="">`:esc(iniciais(p.nome))}</div><div><h1>${esc(p.nome)}</h1><p style="color:var(--sage);margin:6px 0 0">${esc(p.objetivo||"Objetivo não informado")}</p></div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sec" id="voltar">Voltar</button><button class="btn perigo" id="excluir">Excluir paciente</button></div></header>
<div class="painel"><div class="detalhes">
<div class="det"><strong>Idade</strong>${p.idade!==""&&p.idade!=null?esc(p.idade)+" anos":"Não informada"}</div>
<div class="det"><strong>Telefone</strong>${esc(p.telefone||"Não informado")}</div>
<div class="det"><strong>E-mail</strong>${esc(p.email||"Não informado")}</div>
<div class="det"><strong>Objetivo</strong>${esc(p.objetivo||"Não informado")}</div>
<div class="det" style="grid-column:1/-1"><strong>Observações</strong>${esc(p.obs||"Nenhuma observação")}</div>
<div class="det" style="grid-column:1/-1"><strong>Agendamentos</strong>${ap.length?ap.map(a=>`${fmt(a.data)} às ${esc(a.hora)}${a.obs?" · "+esc(a.obs):""}`).join("<br>"):"Nenhum agendamento"}</div>
</div></div>`;
document.getElementById("voltar").onclick=()=>ir("pacientes");
document.getElementById("excluir").onclick=()=>{
if(!confirm("Excluir este paciente e os agendamentos dele?"))return;
S.patients=S.patients.filter(x=>x.id!==id);
S.appointments=S.appointments.filter(x=>x.pid!==id);
save();ir("pacientes");
};
ir("perfil");
}

document.getElementById("form").onsubmit=async e=>{
e.preventDefault();
const f=e.target;
const data=f.data.value,hora=f.hora.value;
if(!!data!==!!hora){alert("Preencha data e horário juntos para criar o agendamento.");return}
const arq=f.foto.files[0];
let foto="";
if(arq){
if(arq.size>1500000){alert("Escolha uma imagem menor que 1,5 MB.");return}
foto=await new Promise(r=>{const rd=new FileReader();rd.onload=()=>r(rd.result);rd.onerror=()=>r("");rd.readAsDataURL(arq)});
}
const id="p"+Date.now();
S.patients.unshift({id,nome:f.nome.value.trim(),idade:f.idade.value,objetivo:f.objetivo.value.trim(),telefone:f.telefone.value.trim(),email:f.email.value.trim(),obs:f.obs.value.trim(),foto,ex:false});
if(data&&hora){
S.appointments.push({id:"a"+Date.now(),pid:id,data,hora,obs:f.obsag.value.trim(),ex:false});
const [y,m]=data.split("-").map(Number);
cur=new Date(y,m-1,1);sel=data;
}
save();
f.reset();
alert("Paciente cadastrado neste navegador.");
ir(data&&hora?"agenda":"pacientes");
};

ir("agenda");
</script>
</body>
</html>
