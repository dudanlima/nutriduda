<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#7A816C">
<title>Perfil do paciente</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Times New Roman",Times,serif;color:#3B332C;background:#7A816C url("../../ceu.jpg") center/cover no-repeat fixed;min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;background:rgba(122,129,108,.55);z-index:0}
.app{position:relative;z-index:1;display:flex;min-height:100vh}
aside{width:230px;flex-shrink:0;background:rgba(122,129,108,.92);color:#E5DFD6;padding:22px 16px;transition:width .25s,padding .25s;overflow:hidden}
aside.recolhido{width:72px;padding:22px 10px}
.topo-menu{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;gap:8px}
.alternar{width:38px;height:38px;border:1px solid #D1A9A5;border-radius:8px;background:transparent;color:#E5DFD6;font-size:20px;flex-shrink:0;cursor:pointer}
.alternar:hover{background:#D1A9A5;color:#7A816C}
.titulo-menu{font-size:17px;white-space:nowrap}
aside.recolhido .titulo-menu,aside.recolhido .rotulo{display:none}
.menu{display:flex;flex-direction:column;gap:8px}
.menu a{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid transparent;border-radius:8px;color:#E5DFD6;font-size:17px;white-space:nowrap;text-decoration:none}
.menu a:hover{background:rgba(229,223,214,.18)}
.menu a.ativo{background:#E5DFD6;color:#7A816C;border-color:#E5DFD6}
.icone{width:22px;text-align:center;flex-shrink:0;font-weight:bold;color:#D1A9A5}
.menu a.ativo .icone{color:#AE6965}
main{flex:1;min-width:0;padding:clamp(18px,3vw,36px)}
.topo{display:flex;justify-content:flex-end;margin-bottom:20px}
.botao-topo{padding:10px 18px;border:1px solid #D1A9A5;border-radius:8px;color:#E5DFD6;text-decoration:none;font-size:16px;background:rgba(122,129,108,.35)}
.botao-topo:hover{background:#D1A9A5;color:#7A816C}
.cartao{background:rgba(229,223,214,.94);border:1px solid #D1A9A5;border-radius:14px;padding:clamp(18px,3vw,30px);box-shadow:0 8px 24px rgba(59,51,44,.18);margin-bottom:20px;min-width:0}
.cabeca{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:20px}
.foto{width:84px;height:84px;border-radius:50%;background:#FFFFFF center/cover no-repeat;border:2px solid #D1A9A5;display:flex;align-items:center;justify-content:center;color:#7A816C;font-size:30px;flex-shrink:0}
.cabeca h1{margin:0 0 4px;font-weight:normal;font-size:clamp(24px,4vw,34px);color:#7A816C}
.cabeca .sub{font-style:italic;color:#AE6965;font-size:17px}
.abas{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 22px;padding:14px;background:#7A816C;border-radius:12px}
.aba{padding:12px 18px;border:1px solid #E5DFD6;border-radius:10px;background:#FFFFFF;color:#7A816C;font:inherit;font-size:16px;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.aba:hover{background:#D1A9A5;border-color:#D1A9A5;color:#7A816C}
.aba.ativa{background:#AE6965;border-color:#AE6965;color:#FFFFFF}
.painel{display:none}
.painel.ativo{display:block}
.numeros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.num{background:#FFFFFF;border:1px solid #D1A9A5;border-radius:12px;padding:14px;text-align:center}
.num .rot{display:block;font-size:14px;color:#A58B71}
.num .val{display:block;font-size:22px;font-weight:bold;color:#7A816C;margin-top:4px}
.grafico{background:#FFFFFF;border:1px solid #D1A9A5;border-radius:12px;padding:14px;margin-bottom:16px;overflow-x:auto}
.grafico h3{margin:0 0 8px;font-weight:normal;font-size:18px;color:#7A816C}
.grafico svg{width:100%;height:auto;display:block;min-width:260px}
.vazio{font-style:italic;color:#A58B71;margin:6px 0}
dl{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:10px 16px;margin:0}
dt{color:#7A816C;font-weight:bold}
dd{margin:0;word-break:break-word}
@media(max-width:700px){
  .app{flex-direction:column}
  aside{width:100%;padding:14px 16px}
  aside.recolhido{width:100%;padding:14px 16px}
  aside.recolhido .titulo-menu,aside.recolhido .rotulo{display:inline}
  .menu{flex-direction:row;flex-wrap:wrap}
  .menu a{flex:1 1 auto;justify-content:center}
  .rotulo{display:inline}
  aside.fechado .menu{display:none}
  .botao-topo{width:100%;text-align:center}
  .aba{flex:1 1 auto}
  dl{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
<aside id="menu">
<div class="topo-menu">
<span class="titulo-menu">Menu</span>
<button class="alternar" id="alternar" aria-label="Recolher ou expandir menu">&#9776;</button>
</div>
<nav class="menu">
<a href="../../painel/index.html"><span class="icone">I</span><span class="rotulo">Início</span></a>
<a href="../../painel/index.html#agenda"><span class="icone">A</span><span class="rotulo">Agenda</span></a>
<a href="../../painel/plano/index.html"><span class="icone">N</span><span class="rotulo">Plano alimentar</span></a>
<a href="../index.html" class="ativo"><span class="icone">P</span><span class="rotulo">Pacientes</span></a>
<a href="../cadastro.html"><span class="icone">+</span><span class="rotulo">Cadastrar paciente</span></a>
<a href="../../painel/index.html#configuracoes"><span class="icone">C</span><span class="rotulo">Configurações</span></a>
</nav>
</aside>
<main>
<div class="topo"><a class="botao-topo" href="../../login/index.html">Sair</a></div>
<div class="cartao" id="conteudo"></div>
</main>
</div>
<script>
(function(){
  var menu=document.getElementById('menu');
  document.getElementById('alternar').addEventListener('click',function(){
    menu.classList.toggle('recolhido');
    menu.classList.toggle('fechado');
  });
  function esc(t){var d=document.createElement('div');d.textContent=t==null?'':String(t);return d.innerHTML;}
  function lerJSON(k,padrao){try{var v=JSON.parse(localStorage.getItem(k)||'null');return v==null?padrao:v;}catch(e){return padrao;}}
  var i=parseInt(new URLSearchParams(location.search).get('i'),10);
  var pacientes=lerJSON('pacientes',[]);
  if(!Array.isArray(pacientes))pacientes=[];
  var conteudo=document.getElementById('conteudo');
  if(isNaN(i)||!pacientes[i]){
    conteudo.innerHTML='<h1 style="font-weight:normal;color:#7A816C;margin:0 0 10px">Paciente não encontrada</h1><p style="font-size:18px">Volte à lista e toque no nome da paciente.</p><a class="aba" href="../index.html">Voltar para Pacientes</a>';
    return;
  }
  var p=pacientes[i];
  var medidasTodas=lerJSON('medidas',{});
  var examesTodos=lerJSON('exames',{});
  var medidas=Array.isArray(medidasTodas[i])?medidasTodas[i]:[];
  var exames=Array.isArray(examesTodos[i])?examesTodos[i]:[];
  var inicial=((p.nome||'?').charAt(0)||'?').toUpperCase();
  var fotoEstilo=p.foto?' style="background-image:url(&quot;'+esc(p.foto)+'&quot;)"':'';

  function num(v){var n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n;}

  function grafico(titulo,dados,unidade){
    var pts=dados.filter(function(d){return d.v!=null;});
    if(pts.length<2)return '<div class="grafico"><h3>'+esc(titulo)+'</h3><p class="vazio">Registre pelo menos duas avaliações para ver a evolução.</p></div>';
    var W=520,H=200,pad=34;
    var vals=pts.map(function(d){return d.v;});
    var min=Math.min.apply(null,vals),max=Math.max.apply(null,vals);
    if(min===max){min-=1;max+=1;}
    var xs=function(k){return pad+k*(W-2*pad)/(pts.length-1);};
    var ys=function(v){return H-pad-(v-min)/(max-min)*(H-2*pad);};
    var linha=pts.map(function(d,k){return (k?'L':'M')+xs(k).toFixed(1)+','+ys(d.v).toFixed(1);}).join(' ');
    var bolas=pts.map(function(d,k){
      return '<circle cx="'+xs(k).toFixed(1)+'" cy="'+ys(d.v).toFixed(1)+'" r="4" fill="#AE6965"><title>'+esc(d.d)+': '+d.v+' '+esc(unidade)+'</title></circle>'+
             '<text x="'+xs(k).toFixed(1)+'" y="'+(H-10)+'" font-size="11" text-anchor="middle" fill="#A58B71">'+esc(d.d)+'</text>';
    }).join('');
    return '<div class="grafico"><h3>'+esc(titulo)+' ('+esc(unidade)+')</h3>'+
      '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(titulo)+'">'+
      '<line x1="'+pad+'" y1="'+(H-pad)+'" x2="'+(W-pad)+'" y2="'+(H-pad)+'" stroke="#D1A9A5"/>'+
      '<line x1="'+pad+'" y1="'+pad+'" x2="'+pad+'" y2="'+(H-pad)+'" stroke="#D1A9A5"/>'+
      '<text x="4" y="'+(pad+4)+'" font-size="11" fill="#A58B71">'+max.toFixed(1)+'</text>'+
      '<text x="4" y="'+(H-pad)+'" font-size="11" fill="#A58B71">'+min.toFixed(1)+'</text>'+
      '<path d="'+linha+'" fill="none" stroke="#7A816C" stroke-width="2.5"/>'+bolas+
      '</svg></div>';
  }

  var ultima=medidas.length?medidas[medidas.length-1]:{};
  var serie=function(campo){return medidas.map(function(m){return {d:m.data||'',v:num(m[campo])};});};
  var pesoSerie=serie('peso'),imcSerie=serie('imc'),gorduraSerie=serie('gordura'),cinturaSerie=serie('cintura');

  var dadosHtml='<dl>'+Object.keys(p).filter(function(k){return k!=='foto';}).map(function(k){
    return '<dt>'+esc(k.charAt(0).toUpperCase()+k.slice(1))+'</dt><dd>'+esc(p[k])+'</dd>';
  }).join('')+'</dl>';

  var visao='<div class="numeros">'+
    '<div class="num"><span class="rot">Peso</span><span class="val">'+esc(ultima.peso||'-')+(ultima.peso?' kg':'')+'</span></div>'+
    '<div class="num"><span class="rot">IMC</span><span class="val">'+esc(ultima.imc||'-')+'</span></div>'+
    '<div class="num"><span class="rot">Gordura</span><span class="val">'+esc(ultima.gordura||'-')+(ultima.gordura?' %':'')+'</span></div>'+
    '<div class="num"><span class="rot">Avaliações</span><span class="val">'+medidas.length+'</span></div>'+
    '</div>'+
    grafico('Peso',pesoSerie,'kg')+
    grafico('IMC',imcSerie,'kg/m²')+
    grafico('Gordura corporal',gorduraSerie,'%')+
    grafico('Cintura',cinturaSerie,'cm');

  conteudo.innerHTML=
    '<div class="cabeca"><div class="foto"'+fotoEstilo+'>'+(p.foto?'':esc(inicial))+'</div>'+
    '<div><h1>'+esc(p.nome)+'</h1><div class="sub">'+esc(p.objetivo||'')+(p.idade?' · '+esc(p.idade)+' anos':'')+'</div></div></div>'+
    '<div class="abas">'+
      '<button class="aba ativa" data-aba="p-visao">Visão geral</button>'+
      '<button class="aba" data-aba="p-dados">Dados</button>'+
      '<a class="aba" href="../exames/index.html?i='+i+'">Exames</a>'+
      '<a class="aba" href="../../painel/plano/index.html?i='+i+'">Plano alimentar</a>'+
      '<a class="aba" href="../medidas/index.html?i='+i+'">Medidas</a>'+
      '<a class="aba" href="../evolução/index.html?i='+i+'">Evolução</a>'+
    '</div>'+
    '<section class="painel ativo" id="p-visao">'+visao+'</section>'+
    '<section class="painel" id="p-dados">'+dadosHtml+'</section>';

  var botoes=conteudo.querySelectorAll('button.aba');
  botoes.forEach(function(b){
    b.addEventListener('click',function(){
      botoes.forEach(function(x){x.classList.remove('ativa');});
      conteudo.querySelectorAll('.painel').forEach(function(x){x.classList.remove('ativo');});
      b.classList.add('ativa');
      document.getElementById(b.getAttribute('data-aba')).classList.add('ativo');
    });
  });
})();
</script>
</body>
</html>
