    header {
      position: absolute;
      inset: 0 0 auto;
      z-index: 1;
      display: flex;
      justify-content: flex-end;
      padding: calc(env(safe-area-inset-top) + 16px) 22px 16px;
      border-bottom: 1px solid rgba(237, 218, 159, 0.2);
      background: rgba(35, 14, 15, 0.25);
    }

    .painel {
      padding: 10px 16px;
      border: 1px solid rgba(237, 218, 159, 0.75);
      border-radius: 6px;
      color: var(--dourado);
      background: rgba(35, 14, 15, 0.2);
      font: 16px "Times New Roman", Times, serif;
      cursor: pointer;
    }

    main {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 80px 20px 24px;
    }

    .conteudo {
      width: min(100%, 500px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
    }

    .marca {
      position: relative;
      width: min(100%, 420px);
      aspect-ratio: 3.25 / 1;
      overflow: hidden;
    }

    .marca img {
      position: absolute;
      top: 0;
      left: 0;
      display: block;
      width: 129.1%;
      max-width: none;
      height: auto;
      transform: translate(-13.1%, -39.3%);
    }

    .entrar {
      width: min(100%, 270px);
      min-height: 56px;
      border: 1px solid var(--dourado);
      border-radius: 6px;
      color: var(--vinho);
      background: var(--dourado);
      font: bold 19px "Times New Roman", Times, serif;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(20, 5, 10, 0.25);
    }

    .entrar:active {
      background: #fff3d2;
    }

    button:focus-visible {
      outline: 3px solid var(--rosa-claro);
      outline-offset: 4px;
    }

    @media (max-width: 480px) {
      .conteudo {
        gap: 24px;
      }

      .marca {
        width: min(100%, 360px);
      }
    }
  </style>
</head>
